[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "postpy"
dynamic = ["version"]
authors = [
  { name="Patrick Zweil" },
]
description = "A Postman-style API testing and mock server tool written in Python"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "click>=8.1.0",
    "rich>=13.0.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "pydantic>=2.0.0",
    "flask>=3.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "isort>=5.0.0",
    "mypy>=1.0.0",
    "types-requests",
    "types-PyYAML",
]

[project.urls]
Homepage = "https://github.com/patricksmithlaravel/PostPy"
Changelog = "https://github.com/patricksmithlaravel/PostPy/blob/main/CHANGELOG.md"

[project.scripts]
postpy = "postpy.cli:cli"

[tool.setuptools.dynamic]
version = { attr = "postpy.__version__" }

[tool.setuptools.packages.find]
include = ["postpy", "postpy.*"]
namespaces = false

[tool.setuptools.package-data]
"postpy.config" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.black]
line-length = 88
target-version = ["py39"]

[tool.isort]
profile = "black"

[tool.mypy]
files = ["postpy"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
